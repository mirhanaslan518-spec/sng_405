<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
 
<body>
    <canvas id="weatherCanvas"></canvas>
    <div id="lightningOverlay"></div>
 
    <div class="container">
        <h1><i class="fa-solid fa-cloud-sun"></i> Weather Website</h1>
 
        <form id="weatherForm">
            <input type="text" id="cityInput" placeholder="Enter a city name..." />
            <button type="submit">Search</button>
        </form>
 
        <div class="toggle-row">
            <span class="toggle-label">°C</span>
            <label class="switch">
                <input type="checkbox" id="unitToggle" />
                <span class="slider"></span>
            </label>
            <span class="toggle-label">°F</span>
        </div>
 
        <div id="weatherResults"></div>
        <div id="forecastSection"></div>
 
        <hr />
 
        <div class="default-cities">
            <h3>Featured Today</h3>
            <div class="city-cards-grid" id="cityCardsGrid"></div>
        </div>
    </div>
</body>
 
</html>
